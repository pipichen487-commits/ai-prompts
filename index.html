<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI 提示词工具箱</title>
<style>
  :root {
    --primary: #6366f1;
    --primary-light: #eef2ff;
    --primary-dark: #4f46e5;
    --accent: #06b6d4;
    --orange: #f59e0b;
    --pink: #ec4899;
    --green: #10b981;
    --gray-50: #f8fafc;
    --gray-100: #f1f5f9;
    --gray-200: #e2e8f0;
    --gray-500: #64748b;
    --gray-700: #334155;
    --gray-900: #0f172a;
    --radius: 12px;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
    --shadow-lg: 0 10px 30px rgba(0,0,0,.1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
    background: var(--gray-50);
    color: var(--gray-900);
    min-height: 100vh;
  }

  /* Header */
  .header {
    background: linear-gradient(135deg, var(--primary), var(--accent));
    color: #fff;
    padding: 36px 20px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    opacity: .4;
  }
  .header h1 { font-size: 28px; font-weight: 800; position: relative; letter-spacing: 1px; }
  .header p { font-size: 14px; opacity: .85; margin-top: 6px; position: relative; }

  /* Search */
  .search-wrap {
    max-width: 600px;
    margin: -24px auto 20px;
    padding: 0 16px;
    position: relative;
    z-index: 10;
  }
  .search-box {
    display: flex;
    align-items: center;
    background: #fff;
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    padding: 4px 16px;
    gap: 10px;
  }
  .search-box input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 15px;
    padding: 14px 0;
    background: transparent;
  }
  .search-box input::placeholder { color: var(--gray-500); }
  .search-box .icon { font-size: 18px; color: var(--gray-500); }

  /* Categories */
  .cat-nav {
    display: flex;
    gap: 8px;
    padding: 0 16px 16px;
    max-width: 1100px;
    margin: 0 auto;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .cat-nav::-webkit-scrollbar { display: none; }
  .cat-btn {
    flex-shrink: 0;
    padding: 10px 20px;
    border: 2px solid var(--gray-200);
    border-radius: 100px;
    background: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: .2s;
    color: var(--gray-700);
    white-space: nowrap;
  }
  .cat-btn:hover { border-color: var(--primary); color: var(--primary); }
  .cat-btn.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
    box-shadow: 0 4px 12px rgba(99,102,241,.35);
  }

  /* Grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 16px 40px;
  }

  /* Card */
  .card {
    background: #fff;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
    cursor: pointer;
    transition: .2s;
    border: 2px solid transparent;
    position: relative;
  }
  .card:hover {
    box-shadow: var(--shadow-lg);
    border-color: var(--primary);
    transform: translateY(-2px);
  }
  .card:active { transform: scale(.98); }
  .card .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 10px;
    border-radius: 100px;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: .5px;
  }
  .badge-blue { background: var(--primary-light); color: var(--primary); }
  .badge-green { background: #d1fae5; color: #059669; }
  .badge-orange { background: #fef3c7; color: #d97706; }
  .badge-pink { background: #fce7f3; color: #db2777; }
  .badge-cyan { background: #cffafe; color: #0891b2; }
  .badge-purple { background: #f3e8ff; color: #9333ea; }

  .card .title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .card .desc {
    font-size: 13px;
    color: var(--gray-500);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card .prompt-preview {
    margin-top: 12px;
    background: var(--gray-100);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12px;
    color: var(--gray-700);
    line-height: 1.5;
    max-height: 60px;
    overflow: hidden;
    position: relative;
  }
  .card .prompt-preview::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 24px;
    background: linear-gradient(transparent, var(--gray-100));
  }
  .card .copy-hint {
    position: absolute;
    top: 16px;
    right: 16px;
    font-size: 12px;
    color: var(--gray-500);
    opacity: 0;
    transition: .2s;
    background: var(--gray-100);
    padding: 2px 10px;
    border-radius: 100px;
  }
  .card:hover .copy-hint { opacity: 1; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--gray-900);
    color: #fff;
    padding: 12px 24px;
    border-radius: 100px;
    font-size: 14px;
    font-weight: 600;
    opacity: 0;
    transition: .3s;
    z-index: 999;
    pointer-events: none;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.5);
    z-index: 998;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #fff;
    border-radius: 16px;
    max-width: 600px;
    width: 100%;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 25px 50px rgba(0,0,0,.25);
  }
  .modal-header {
    padding: 20px 24px 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .modal-header h2 { font-size: 20px; }
  .modal-header .badge { margin-top: 4px; }
  .modal-close {
    background: var(--gray-100);
    border: none;
    width: 32px; height: 32px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    color: var(--gray-500);
    transition: .2s;
    flex-shrink: 0;
  }
  .modal-close:hover { background: var(--gray-200); }
  .modal-body {
    padding: 16px 24px 24px;
    overflow-y: auto;
    flex: 1;
  }
  .modal-body .desc { font-size: 14px; color: var(--gray-500); margin-bottom: 16px; }
  .modal-body textarea {
    width: 100%;
    min-height: 180px;
    padding: 16px;
    border: 2px solid var(--gray-200);
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.6;
    resize: vertical;
    font-family: inherit;
    outline: none;
    transition: .2s;
  }
  .modal-body textarea:focus { border-color: var(--primary); }
  .modal-body .btn-copy {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 12px;
    padding: 12px 24px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 100px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: .2s;
  }
  .modal-body .btn-copy:hover { background: var(--primary-dark); }
  .modal-body .btn-copy:active { transform: scale(.97); }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--gray-500);
    grid-column: 1 / -1;
  }
  .empty .big { font-size: 48px; margin-bottom: 12px; }

  footer {
    text-align: center;
    padding: 24px;
    font-size: 13px;
    color: var(--gray-500);
  }

  @media (max-width: 640px) {
    .grid { grid-template-columns: 1fr; }
    .header h1 { font-size: 22px; }
    .cat-btn { padding: 8px 16px; font-size: 13px; }
  }
</style>
</head>
<body>

<header class="header">
  <h1>🤖 AI 提示词工具箱</h1>
  <p>精选提示词模板 · 一键复制 · 即开即用</p>
</header>

<div class="search-wrap">
  <div class="search-box">
    <span class="icon">🔍</span>
    <input type="text" id="searchInput" placeholder="搜索提示词..." oninput="render()">
  </div>
</div>

<div class="cat-nav" id="catNav"></div>

<div class="grid" id="grid"></div>

<div class="toast" id="toast">✅ 已复制到剪贴板</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <div>
        <h2 id="modalTitle"></h2>
        <span class="badge" id="modalBadge"></span>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <p class="desc" id="modalDesc"></p>
      <textarea id="modalText" readonly></textarea>
      <button class="btn-copy" onclick="copyModal()">📋 复制提示词</button>
    </div>
  </div>
</div>

<footer>收集整理 · 持续更新 🚀</footer>

<script>
const data = [
  // ===== 写作助手 =====
  { cat: "写作", title: "通用文章写作", badge: "blue", desc: "按主题生成结构完整的文章，支持议论文/说明文/记叙文", prompt: "请帮我写一篇关于【主题】的文章，文体为【议论文/说明文/记叙文】，字数约【800】字。要求：结构清晰、有开头的引入、中间的论述展开、最后的总结收尾。语言风格【正式/轻松/学术】。" },
  { cat: "写作", title: "小红书文案", badge: "pink", desc: "生成小红书风格种草笔记，带 emoji 和话题标签", prompt: "请写一篇小红书风格的种草笔记，主题是【产品/体验名称】。要求：标题要吸引眼球，正文使用 emoji 和分段，突出 3 个核心卖点，最后加上相关话题标签。语气亲切真实，像朋友推荐一样。" },
  { cat: "写作", title: "公众号文章", badge: "blue", desc: "公众号长文排版风格，适合信息类/观点类内容", prompt: "请以公众号风格写一篇关于【主题】的文章。要求：开头用引人入胜的 hook 或故事引入，正文分 3-4 个小标题段落，每个段落有核心观点+案例/数据支撑，结尾要有互动引导（点赞/在看/留言）。全文约 1500 字。" },
  { cat: "写作", title: "短视频脚本", badge: "orange", desc: "15-60 秒短视频口播脚本，含画面描述", prompt: "请写一个【15/30/60】秒的短视频脚本，主题是【主题】。格式：时间码 + 画面描述 + 口播文案。开头 3 秒要 hook 住观众，中间讲核心内容，结尾引导关注/点赞。适合【抖音/快手/视频号】风格。" },
  { cat: "写作", title: "邮件写作", badge: "green", desc: "商务邮件/求职邮件/日常邮件模板", prompt: "请帮我写一封【商务/求职/日常】邮件。收件人：【身份】。目的：【目的】。语气：【正式/半正式/友好】。请包含邮件主题行、称呼、正文、结束语。" },
  { cat: "写作", title: "演讲稿", badge: "purple", desc: "各种场合演讲稿，含开场白/主体/结尾", prompt: "请写一篇关于【主题】的演讲稿，演讲时长约【5】分钟。要求：开场白要抓人（可以用提问/故事/数据），主体分 3 个要点展开，结尾要有号召力。适合场合：【会议/典礼/TED风格】。" },

  // ===== 编程开发 =====
  { cat: "编程", title: "代码生成", badge: "green", desc: "按需求生成完整代码，支持各种语言", prompt: "请用【Python/JavaScript/Java/Go/其他】实现【功能描述】。要求：代码完整可运行，包含必要的错误处理，添加中文注释说明关键逻辑。输入输出格式：【描述】。" },
  { cat: "编程", title: "代码审查", badge: "orange", desc: "审查代码质量、安全性、性能问题", prompt: "请审查以下代码，检查：1) 潜在的 bug 和逻辑错误 2) 安全漏洞 3) 性能问题 4) 代码风格和可读性 5) 可以优化的地方。按严重程度分类输出报告。【粘贴代码】" },
  { cat: "编程", title: "Bug 修复", badge: "red", desc: "分析错误信息并给出修复方案", prompt: "我遇到了以下错误：\n【粘贴错误信息】\n相关代码：\n【粘贴代码】\n请帮我：1) 分析错误原因 2) 给出修复方案 3) 解释为什么这个修复有效" },
  { cat: "编程", title: "SQL 查询", badge: "blue", desc: "生成/优化 SQL 查询语句", prompt: "数据表结构如下：\n【描述表结构】\n我需要查询：【需求描述】\n请帮我写对应的 SQL 查询语句，要求：1) 高效 2) 包含必要的索引建议 3) 如果是复杂查询请解释执行逻辑" },
  { cat: "编程", title: "正则表达式", badge: "purple", desc: "生成和解释正则表达式", prompt: "我需要一个正则表达式来匹配【描述要匹配的文本模式】。样本数据：\n【提供样本】\n请给出正则表达式并解释每一部分的含义，同时提供不同语言的用法示例。" },
  { cat: "编程", title: "API 接口设计", badge: "cyan", desc: "RESTful API 接口设计方案", prompt: "请帮我设计一个【RESTful/GraphQL】API，功能是：【功能描述】。请输出：1) 接口列表（方法+路径）2) 请求/响应格式（JSON） 3) 鉴权方式 4) 错误处理方案 5) 使用示例。" },
  { cat: "编程", title: "重构建议", badge: "green", desc: "代码重构优化建议，提升可维护性", prompt: "请帮我重构以下代码，目标是：提高可读性、降低复杂度、提升可维护性。\n【粘贴代码】\n请输出：1) 当前代码的问题 2) 重构后的代码 3) 重构要点说明" },
  { cat: "编程", title: "单元测试", badge: "orange", desc: "生成单元测试用例和测试代码", prompt: "请为以下代码编写单元测试：\n【粘贴代码】\n测试框架：【Jest/Pytest/JUnit/其他】。要求：覆盖正常情况、边界情况、异常情况。测试代码需要可运行。" },

  // ===== 图像生成 =====

  { cat: "图像", title: "DALL·E 提示词", badge: "green", desc: "面向 DALL·E 3 的详细画面描述", prompt: "请为 DALL·E 3 生成一段详细的画面描述提示词，主题：【描述】。要求：包含主体描述、环境/背景、光线/色调、构图方式、艺术风格。用英文写，清晰准确。" },
  { cat: "图像", title: "Stable Diffusion", badge: "blue", desc: "SD 提示词 + 负面提示词 + 参数", prompt: "请为 Stable Diffusion 生成提示词。正向提示词：【画面描述】。请同时提供：1) 正向提示词（英文） 2) 负面提示词（常见的画质问题和不需要的元素） 3) 建议参数（Steps, CFG, Sampler, Model 等）" },
  { cat: "图像", title: "Logo 设计思路", badge: "orange", desc: "根据品牌描述生成 Logo 设计方案", prompt: "请为【品牌名】设计一个 Logo 方案。品牌定位：【描述】。行业：【行业】。请输出 3 个不同方向的概念方案，每个方案包含：1) 设计理念 2) 色彩方案 3) 图形元素描述 4) 适用于 AI 生成工具的提示词。" },

  { cat: "角色", title: "面试模拟", badge: "blue", desc: "模拟面试官进行岗位面试练习", prompt: "请你扮演一名面试官，面试岗位：【职位名称】，行业：【行业】。面试等级：【初级/中级/高级】。请按真实面试流程进行：先让我自我介绍，然后依次提问技术问题、行为问题、情景问题，最后给出反馈。每次我问完回答后，你再继续追问。" },

const categories = [...new Set(data.map(d => d.cat))];
const badgeColors = { blue: 'badge-blue', green: 'badge-green', orange: 'badge-orange', pink: 'badge-pink', cyan: 'badge-cyan', purple: 'badge-purple', red: 'badge-pink' };

let currentCat = '全部';
let currentData = data;

// Render cat nav
function renderCatNav() {
  const nav = document.getElementById('catNav');
  const allCats = ['全部', ...categories];
  nav.innerHTML = allCats.map(c =>
    `<button class="cat-btn${c === currentCat ? ' active' : ''}" onclick="switchCat('${c}')">${c}</button>`
  ).join('');
}

// Switch category
function switchCat(cat) {
  currentCat = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('active', b.textContent === cat));
  render();
}

// Render cards
function render() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  currentData = data.filter(d => {
    const matchCat = currentCat === '全部' || d.cat === currentCat;
    const matchSearch = !q || d.title.toLowerCase().includes(q) || d.desc.toLowerCase().includes(q) || d.cat.includes(q);
    return matchCat && matchSearch;
  });
  const grid = document.getElementById('grid');
  if (currentData.length === 0) {
    grid.innerHTML = '<div class="empty"><div class="big">🔍</div><p>没有找到匹配的提示词</p></div>';
    return;
  }
  grid.innerHTML = currentData.map(d => `
    <div class="card" onclick="openModal(${data.indexOf(d)})">
      <span class="badge ${badgeColors[d.badge] || 'badge-blue'}">${d.cat}</span>
      <span class="copy-hint">点击查看</span>
      <div class="title">${d.title}</div>
      <div class="desc">${d.desc}</div>
      <div class="prompt-preview">${d.prompt.slice(0, 80)}...</div>
    </div>
  `).join('');
}

// Modal
let currentIdx = -1;
function openModal(idx) {
  currentIdx = idx;
  const d = data[idx];
  document.getElementById('modalTitle').textContent = d.title;
  document.getElementById('modalDesc').textContent = d.desc;
  document.getElementById('modalBadge').textContent = d.cat;
  document.getElementById('modalBadge').className = 'badge ' + (badgeColors[d.badge] || 'badge-blue');
  document.getElementById('modalText').value = d.prompt;
  document.getElementById('modal').classList.add('open');
}
function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

function copyModal() {
  const text = document.getElementById('modalText');
  text.select();
  navigator.clipboard.writeText(text.value).then(() => showToast());
}

function showToast() {
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// Close modal on overlay click
document.getElementById('modal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

// Init
renderCatNav();
render();
</script>
